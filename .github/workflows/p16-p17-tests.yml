name: P16-P17 focused tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/p16a-capability-analysis]

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P16/P17 tests
        run: >-
          python -m pytest -q
          tests/test_capability_analysis.py
          tests/scfg
          tests/pipeline
